name: Release

# Publishing step. The tag comes LAST, after validation has already happened:
#
#   1. push your branch      -> CI (ci.yml) runs the suite + build
#   2. it passes             -> merge to main
#   3. main goes green       -> CI ran again on the merge itself
#   4. only then             -> git tag vX && git push origin vX   (this file)
#
# So tagging publishes something already known-good rather than being the thing
# that discovers a problem. This workflow re-runs the suite regardless, because
# the tagged commit is what ships and a merge can break what neither side broke
# alone — but by then it should never be the first time anyone finds out.
#
# It builds the skin, stamps the tag into dist/manifest.json, zips the
# *contents* of dist/ (so index.html is at the zip root, as the gateway
# expects), and publishes a GitHub Release with that zip attached.
#
# If the suite does fail here, no release is published — but the tag is already
# pushed. To retry after fixing:
#   git push --delete origin vX && git tag -d vX   # then re-tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed for `gh release create`

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Last line of defence, not the primary gate — that's ci.yml on the
      # branch and on main. This re-checks the exact commit being published,
      # since every step below it ships to gateways that auto-update.
      - run: npm test

      # Stamp the tag (without the leading "v") as the app version baked into
      # the bundle, so the About screen matches the manifest. The display
      # prepends "v" itself.
      - run: OVERDOSE_VERSION="${GITHUB_REF_NAME#v}" npm run build

      - name: Package dist as overdose-<tag>.zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Stamp the released version into the manifest (keeps the committed
          # manifest's version as a dev default; the tag is the source of truth).
          jq --arg v "$VERSION" '.version = $v' dist/manifest.json > dist/manifest.tmp
          mv dist/manifest.tmp dist/manifest.json
          ( cd dist && zip -r "../overdose-${GITHUB_REF_NAME}.zip" . )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "overdose-${GITHUB_REF_NAME}.zip" \
            --title "OverDose $GITHUB_REF_NAME" \
            --generate-notes
